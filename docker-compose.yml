services:
  db:
    image: postgres:17
    container_name: teamboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - teamboard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teamboard_data: